<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo de JavaScript</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="quiz-card" id="quiz-card">
    <div class="quiz-header">
      <h1>Test de JavaScript</h1>
      <span id="progress">Pregunta 1/5</span>
    </div>

    <div id="quiz-body">
      <div class="question" id="question-text">Cargando pregunta...</div>
      <div class="options" id="options-container"></div>
    </div>

    <div class="footer">
      <div id="score-counter">Puntos: 0</div>
      <button class="btn-next" id="next-btn">Siguiente</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
